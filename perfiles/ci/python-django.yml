# AuroraTK Kernel v4.0.0 · CI for the Python / Django profile.
# kernel_sync.py sync copies this file to .github/workflows/ci.yml (yours after that) and the scripts to scripts/.
# R12 (risk and PR description) runs in its own workflow, pr-description.yml, from the main branch.
# Merge pyproject-django.toml into pyproject.toml.
#
# Staged activation (KERNEL, "Activación por etapas"): set the repository variable
# KERNEL_STAGE (Settings > Secrets and variables > Actions > Variables) to 1, 2 or 3.
# Stage 1 needs at least one test (pytest exits with code 5 when there are none).
# Stage 2 needs production settings at config/settings/production.py.
# MUTATION_THRESHOLD: 60 (Standard) or 75 (Strict). Mutation runs weekly, not per PR.
# R07: actions are pinned to a full commit SHA (a tag can be moved to other code);
# the comment keeps the readable version, and Dependabot (github-actions) updates both.
# Kernel copy: run `kernel_sync.py sync` once (guias/adoptar.md). The step below fetches the kernel
# at the ref pinned in .github/kernel.txt and runs ITS kernel_sync.py check: edited, missing or extra
# kernel files, or a weakened .claude/settings.json, fail the build.

name: CI

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]
  push:
    branches: [main]
  schedule:
    - cron: "0 9 * * 1"
  workflow_dispatch:

permissions:
  contents: read

env:
  STAGE: ${{ fromJSON(vars.KERNEL_STAGE || '1') }}

jobs:
  verify:
    if: github.event_name == 'pull_request' || github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgres://ci:ci@localhost:5432/ci
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - name: R05 throwaway secret key (never a real one)
        run: echo "DJANGO_SECRET_KEY=$(python3 -c 'import secrets; print(secrets.token_urlsafe(64))')" >> "$GITHUB_ENV"
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
      - name: Install (locked)
        run: uv sync --locked
      # --- Stage 1 ---
      - name: R05 secret scan
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Kernel copy identical to the pinned version (.github/kernel.txt)
        shell: bash
        env:
          KERNEL_REPO: https://github.com/tarazonawin-stack/auroratk
        run: |
          set -euo pipefail
          ref="$(awk '$1 == "version" {print $2}' .github/kernel.txt)"
          [[ "$ref" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]] || { echo "::error::bad version line in .github/kernel.txt (a release tag vX.Y.Z)"; exit 1; }
          kernel="${RUNNER_TEMP:-/tmp}/auroratk-kernel"
          rm -rf "$kernel" && git init -q "$kernel"
          git -C "$kernel" fetch -q --depth 1 "$KERNEL_REPO" "refs/tags/$ref"
          git -C "$kernel" checkout -q FETCH_HEAD
          python3 -I "$kernel/perfiles/ci/kernel_sync.py" check --from "$kernel"
      - name: R04 format, lint and types
        run: |
          uv run ruff format --check .
          uv run ruff check .
          uv run mypy .
      - name: R03 tests
        if: env.STAGE == 1
        run: uv run pytest
      # --- Stage 2 ---
      - name: R03 tests and coverage
        if: env.STAGE >= 2
        run: uv run pytest --cov --cov-fail-under=80
      - name: R02 change and file size
        if: env.STAGE >= 2 && github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}  # via env, never pasted into the script
        run: python3 scripts/size_check.py "origin/$BASE_REF"
      - name: R08 migrations up to date
        if: env.STAGE >= 2
        run: uv run python manage.py makemigrations --check --dry-run
      - name: R06 production settings
        if: env.STAGE >= 2
        run: uv run python manage.py check --deploy --fail-level WARNING
        env:
          DJANGO_SETTINGS_MODULE: config.settings.production
      - name: R06 static security analysis
        if: env.STAGE >= 2
        run: |
          uvx semgrep --version
          uvx semgrep scan --config auto --error
      - name: R07 dependency audit (dated exceptions go in --ignore-vuln)
        if: env.STAGE >= 2
        run: |
          uv export --no-hashes --format requirements-txt > /tmp/requirements.txt
          uv run pip-audit -r /tmp/requirements.txt

  mutation:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgres://ci:ci@localhost:5432/ci
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: R05 throwaway secret key (never a real one)
        run: echo "DJANGO_SECRET_KEY=$(python3 -c 'import secrets; print(secrets.token_urlsafe(64))')" >> "$GITHUB_ENV"
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
      - name: Install (locked)
        run: uv sync --locked
      - name: R03 mutation testing (stage 3)
        run: |
          uv run mutmut run
          uv run mutmut export-cicd-stats
          uv run python scripts/mutation_threshold.py "${{ vars.MUTATION_THRESHOLD || '60' }}"
