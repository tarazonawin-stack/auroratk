# AuroraTK Kernel v2.0.0 · CI for the Python / Django profile.
# Copy to .github/workflows/ci.yml. Copy mutation_threshold.py to scripts/.
# Adjust DJANGO_SETTINGS_MODULE to your project's production settings module.
# Mutation testing (R03) runs weekly, not on every PR, to save CI minutes.

name: CI

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "0 9 * * 1"
  workflow_dispatch:

jobs:
  verify:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgres://ci:ci@localhost:5432/ci
      DJANGO_SECRET_KEY: ci-only-not-a-real-secret
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v5
      - name: Install (locked)
        run: uv sync --locked
      - name: R04 format, lint and types
        run: |
          uv run ruff format --check .
          uv run ruff check .
          uv run mypy .
      - name: R03 tests and coverage
        run: uv run pytest --cov --cov-fail-under=80
      - name: R08 migrations up to date
        run: uv run python manage.py makemigrations --check --dry-run
      - name: R06 production settings
        run: uv run python manage.py check --deploy --fail-level WARNING
        env:
          DJANGO_SETTINGS_MODULE: config.settings.production
      - name: R06 static security analysis
        run: uvx semgrep scan --config auto --error
      - name: R07 dependency audit
        run: |
          uv export --no-hashes --format requirements-txt > /tmp/requirements.txt
          uvx pip-audit -r /tmp/requirements.txt
      - name: R05 secret scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  mutation:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Install (locked)
        run: uv sync --locked
      - name: R03 mutation testing
        run: |
          uv run mutmut run
          uv run mutmut export-cicd-stats
          uv run python scripts/mutation_threshold.py 60
