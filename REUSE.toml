SPDX-FileCopyrightText = "2026 Jose Alejandro Tarazona"
SPDX-License-Identifier = "MIT"

[[annotations]]
path = ["plantillas/**", "ejemplos/**"]
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 Jose Alejandro Tarazona"
SPDX-License-Identifier = "MIT-0"
